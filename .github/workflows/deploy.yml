name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to VPS
        run: |
          APP_NAME="sunmoonBackend"
          SERVER_HOST="88.222.213.235"

          ssh -o StrictHostKeyChecking=no root@$SERVER_HOST "
            export PATH=/root/.nvm/versions/node/v20.19.5/bin:\$PATH
            cd /var/www/$APP_NAME
            git reset --hard origin/main
            yarn install
            yarn build
            if tmux has-session -t $APP_NAME 2>/dev/null; then
              tmux kill-session -t $APP_NAME
            fi
            pkill -f 'node dist/server.js' || true
            sleep 1
            tmux new-session -d -s $APP_NAME 'yarn start'
            echo \"Deploy complete — server restarted\"
          "
